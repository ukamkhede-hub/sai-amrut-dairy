<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sai Amrut Dairy</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --green: #15803d;
    --dark-green: #14532d;
    --light-green: #f0fdf4;
    --soft-green: #dcfce7;
    --white: #ffffff;
    --dark: #17201a;
    --gray: #64748b;
    --border: #e2e8f0;
    --whatsapp: #25d366;
}

body {
    font-family: Arial, sans-serif;
    background: #f8fafc;
    color: var(--dark);
}

/* NAVBAR */

.navbar {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: white;
    padding: 16px 6%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 3px 15px rgba(0,0,0,.08);
}

.logo {
    font-size: 23px;
    font-weight: 900;
    color: var(--green);
}

.nav-links {
    display: flex;
    gap: 25px;
    list-style: none;
}

.nav-links a {
    text-decoration: none;
    color: var(--dark);
    font-weight: 600;
}

.nav-links a:hover {
    color: var(--green);
}

/* HERO */

.hero {
    min-height: 500px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 60px 20px;
    background: linear-gradient(135deg,#f0fdf4,#dcfce7);
}

.hero h1 {
    font-size: 55px;
    color: var(--dark-green);
    margin-bottom: 15px;
}

.hero p {
    font-size: 20px;
    color: var(--gray);
    margin-bottom: 25px;
}

.hero-btn {
    display: inline-block;
    padding: 14px 25px;
    border-radius: 10px;
    background: var(--green);
    color: white;
    text-decoration: none;
    font-weight: bold;
}

/* PRODUCTS */

.products-section {
    padding: 70px 6%;
}

.section-title {
    text-align: center;
    margin-bottom: 35px;
}

.section-title h2 {
    font-size: 38px;
    color: var(--dark-green);
    margin-bottom: 10px;
}

.section-title p {
    color: var(--gray);
}

/* SEARCH */

.product-tools {
    max-width: 700px;
    margin: 0 auto 30px;
    display: flex;
    gap: 10px;
}

#productSearch {
    flex: 1;
    padding: 14px 18px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 16px;
    outline: none;
}

#productSearch:focus {
    border-color: var(--green);
}

/* FILTERS */

.filters {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 35px;
}

.filter-btn {
    border: none;
    padding: 10px 18px;
    border-radius: 30px;
    background: white;
    border: 1px solid var(--border);
    cursor: pointer;
    font-weight: 600;
}

.filter-btn.active,
.filter-btn:hover {
    background: var(--green);
    color: white;
}

/* PRODUCT GRID */

.product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(230px,1fr));
    gap: 22px;
}

/* PRODUCT CARD */

.product-card {
    position: relative;
    background: white;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 8px 25px rgba(0,0,0,.08);
    transition: .25s;
    cursor: pointer;
}

.product-card:hover {
    transform: translateY(-7px);
    box-shadow: 0 15px 35px rgba(0,0,0,.14);
}

.product-badge {
    position: absolute;
    top: 12px;
    left: 12px;
    background: var(--green);
    color: white;
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
    z-index: 2;
}

.product-image {
    height: 190px;
    background: var(--light-green);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px;
}

.product-image img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 15px;
}

.product-emoji {
    font-size: 85px;
}

.product-info {
    padding: 20px;
}

.product-info h3 {
    font-size: 19px;
    margin-bottom: 6px;
}

.product-unit {
    color: var(--gray);
    font-size: 14px;
    margin-bottom: 15px;
}

.product-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.price {
    font-size: 20px;
    font-weight: 900;
    color: var(--green);
}

/* QUANTITY */

.quantity-box {
    display: flex;
    align-items: center;
    gap: 8px;
}

.quantity-box button {
    width: 30px;
    height: 30px;
    border: none;
    border-radius: 8px;
    background: var(--green);
    color: white;
    font-size: 20px;
    cursor: pointer;
}

.quantity-box span {
    min-width: 20px;
    text-align: center;
    font-weight: bold;
}

/* ORDER */

.order-section {
    text-align: center;
    padding: 40px 20px 70px;
}

.whatsapp-btn {
    border: none;
    background: var(--whatsapp);
    color: white;
    padding: 16px 28px;
    border-radius: 12px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

/* POPUP */

.product-modal {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 9999;
}

.product-modal.show {
    display: flex;
}

.product-modal-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,.65);
    backdrop-filter: blur(5px);
}

.product-modal-content {
    position: relative;
    z-index: 2;
    width: min(430px,100%);
    background: white;
    border-radius: 25px;
    padding: 30px;
    text-align: center;
    box-shadow: 0 25px 70px rgba(0,0,0,.3);
    animation: popup .25s ease;
}

@keyframes popup {
    from {
        opacity: 0;
        transform: scale(.9) translateY(20px);
    }

    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}

.product-modal-close {
    position: absolute;
    top: 12px;
    right: 15px;
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 50%;
    background: #f1f5f9;
    font-size: 28px;
    cursor: pointer;
    z-index: 5;
}

.product-modal-image {
    width: 220px;
    height: 220px;
    object-fit: contain;
    display: none;
    margin: 15px auto;
    border-radius: 20px;
}

.product-modal-icon {
    width: 120px;
    height: 120px;
    margin: 20px auto;
    border-radius: 30px;
    background: var(--light-green);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 70px;
}

.product-modal-content h2 {
    font-size: 28px;
    margin-bottom: 8px;
}

.product-modal-unit {
    color: var(--gray);
    margin-bottom: 10px;
}

.product-modal-price {
    font-size: 30px;
    color: var(--green);
    font-weight: 900;
    margin-bottom: 20px;
}

/* POPUP QUANTITY */

.modal-quantity {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-bottom: 25px;
}

.modal-quantity button {
    width: 48px;
    height: 48px;
    border: none;
    border-radius: 12px;
    background: var(--green);
    color: white;
    font-size: 25px;
    cursor: pointer;
}

.modal-quantity span {
    font-size: 25px;
    font-weight: bold;
    min-width: 40px;
}

.modal-whatsapp-btn {
    width: 100%;
    border: none;
    padding: 15px;
    border-radius: 12px;
    background: var(--whatsapp);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

/* FOOTER */

footer {
    padding: 35px 20px;
    text-align: center;
    background: var(--dark-green);
    color: white;
}

/* MOBILE */

@media(max-width:700px) {

    .navbar {
        padding: 15px 20px;
    }

    .nav-links {
        display: none;
    }

    .hero h1 {
        font-size: 40px;
    }

    .hero p {
        font-size: 17px;
    }

    .products-section {
        padding: 50px 20px;
    }

    .section-title h2 {
        font-size: 30px;
    }

    .product-grid {
        grid-template-columns: repeat(2,1fr);
        gap: 12px;
    }

    .product-image {
        height: 140px;
    }

    .product-emoji {
        font-size: 60px;
    }

    .product-info {
        padding: 13px;
    }

    .product-info h3 {
        font-size: 15px;
    }

    .price {
        font-size: 17px;
    }

    .product-modal-content {
        padding: 25px 18px;
    }

    .product-modal-image {
        width: 180px;
        height: 180px;
    }
}

@media(max-width:450px) {

    .product-grid {
        grid-template-columns: 1fr;
    }
}

</style>

    {

    {

        badge:"",
        image:"images/coffee.jpg"
    }

];


/* RENDER PRODUCTS */

function renderProducts(list = products) {

    const grid =
        document.getElementById("productGrid");

    grid.innerHTML = "";

    list.forEach(product => {

        const card =
            document.createElement("div");

        card.className = "product-card";

        card.dataset.name =
            product.name.toLowerCase();

        card.dataset.category =
            product.category;

        card.innerHTML = `

            ${
                product.badge
                ?
                `<span class="product-badge">
                    ${product.badge}
                </span>`
                :
                ""
            }

            <div class="product-image">

                <img
                    src="${product.image}"
                    alt="${product.name}"
                    onerror="
                        this.style.display='none';
                        this.nextElementSibling.style.display='flex';
                    "
                >

                <div
                    class="product-emoji"
                    style="display:none;"
                >
                    ${product.icon}
                </div>

            </div>

            <div class="product-info">

                <h3>
                    ${product.name}
                </h3>

                <p class="product-unit">
                    ${product.unit}
                </p>

                <div class="product-bottom">

                    <div class="price">
                        ₹${product.price}
                    </div>

                    <div
                        class="quantity-box"
                        onclick="event.stopPropagation()"
                    >

                        <button
                            onclick="changeQty(this,-1)"
                        >
                            −
                        </button>

                        <span>0</span>

                        <button
                            onclick="changeQty(this,1)"
                        >
                            +
                        </button>

                    </div>

                </div>

            </div>
        `;

        card.onclick = function() {
            openProductDetails(card);
        };

        grid.appendChild(card);

    });

}


/* QUANTITY */

function changeQty(button, change) {

    const span =
        button.parentElement.querySelector("span");

    let quantity =
        parseInt(span.textContent) || 0;

    quantity += change;

    if (quantity < 0) quantity = 0;

    if (quantity > 99) quantity = 99;

    span.textContent = quantity;
}


/* SEARCH */

function searchProducts() {

    const search =
        document
        .getElementById("productSearch")
        .value
        .toLowerCase()
        .trim();

    const activeButton =
        document.querySelector(".filter-btn.active");

    const category =
        activeButton
        ? activeButton.dataset.category
        : "all";

    const filtered =
        products.filter(product => {

            const matchesSearch =
                product.name
                .toLowerCase()
                .includes(search);

            const matchesCategory =
                category === "all" ||
                product.category === category;

            return matchesSearch &&
                   matchesCategory;

        });

    renderProducts(filtered);
}


/* FILTER */

function filterProducts(category, button) {

    document
        .querySelectorAll(".filter-btn")
        .forEach(btn => {
            btn.classList.remove("active");
        });

    button.classList.add("active");

    button.dataset.category = category;

    searchProducts();
}


/* POPUP */

let selectedProductCard = null;


function openProductDetails(card) {

    selectedProductCard = card;

    const name =
        card.querySelector("h3").textContent.trim();

    const unit =
        card.querySelector(".product-unit").textContent.trim();

    const price =
        card.querySelector(".price").textContent.trim();

    const icon =
        card.querySelector(".product-emoji").textContent.trim();

    const image =
        card.querySelector(".product-image img");

    const badge =
        card.querySelector(".product-badge");

    document
        .getElementById("modalProductName")
        .textContent = name;

    document
        .getElementById("modalProductUnit")
        .textContent = unit;

    document
        .getElementById("modalProductPrice")
        .textContent = price;

    document
        .getElementById("modalQuantity")
        .textContent =
        card.querySelector(".quantity-box span").textContent;


    /* POPUP IMAGE */

    const modalImage =
        document.getElementById("modalProductImage");

    const modalIcon =
        document.getElementById("modalIcon");

    if (
        image &&
        image.getAttribute("src") &&
        image.style.display !== "none"
    ) {

        modalImage.src =
            image.getAttribute("src");

        modalImage.style.display =
            "block";

        modalImage.onerror = function() {

            modalImage.style.display =
                "none";

            modalIcon.style.display =
                "flex";

        };

        modalIcon.style.display =
            "none";

    } else {

        modalImage.style.display =
            "none";

        modalIcon.style.display =
            "flex";

        modalIcon.textContent =
            icon;
    }


    /* BADGE */

    document
        .getElementById("modalBadge")
        .innerHTML =
        badge
        ?
        `<span class="product-badge">
            ${badge.textContent}
        </span>`
        :
        "";


    document
        .getElementById("productModal")
        .classList.add("show");

    document.body.style.overflow =
        "hidden";
}


/* CLOSE POPUP */

function closeProductDetails() {

    document
        .getElementById("productModal")
        .classList.remove("show");

    document.body.style.overflow = "";

    selectedProductCard = null;
}


/* POPUP QUANTITY */

function changePopupQty(change) {

    if (!selectedProductCard) return;

    const modalQuantity =
        document.getElementById("modalQuantity");

    let quantity =
        parseInt(modalQuantity.textContent) || 0;

    quantity += change;

    if (quantity < 0) quantity = 0;

    if (quantity > 99) quantity = 99;

    modalQuantity.textContent =
        quantity;

    selectedProductCard
        .querySelector(".quantity-box span")
        .textContent =
        quantity;
}


/* POPUP WHATSAPP */

function orderPopupOnWhatsApp() {

    if (!selectedProductCard) return;

    const quantity =
        parseInt(
            document
            .getElementById("modalQuantity")
            .textContent
        );

    if (quantity <= 0) {

        alert(
            "Please select quantity first."
        );

        return;
    }

    const name =
        selectedProductCard
        .querySelector("h3")
        .textContent
        .trim();

    const unit =
        selectedProductCard
        .querySelector(".product-unit")
        .textContent
        .trim();

    const price =

/* ALL PRODUCTS WHATSAPP */

function sendWhatsAppOrder() {

    const cards =
        document.querySelectorAll(".product-card");

    let orderItems = [];

    let total = 0;

    cards.forEach(card => {

        const quantity =
            parseInt(
                card
                .querySelector(".quantity-box span")
                .textContent
            );

        if (quantity > 0) {

            const name =
                card
                .querySelector("h3")
                .textContent
                .trim();

            const unit =
                card
                .querySelector(".product-unit")
                .textContent
                .trim();

            const price =
                parseInt(
                    card
                    .querySelector(".price")
                    .textContent
                    .replace("₹","")
                );

            const itemTotal =
                price * quantity;

            total += itemTotal;

            orderItems.push(
                `• ${name} (${unit}) × ${quantity} = ₹${itemTotal}`
            );
        }

    });


    if (orderItems.length === 0) {

        alert(
            "Please select at least one product quantity."
        );

        return;
    }


    const message =

`🛒 Sai Amrut Dairy Order

${orderItems.join("\n")}

💰 Estimated Total: ₹${total}

Please confirm my order and delivery details.`;

    const phone =
        "7020034584";

    const url =
        `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;

    window.open(
        url,
        "_blank"
    );
}
